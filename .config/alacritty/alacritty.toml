[general]
import = [
  "~/.config/alacritty/mellow.toml"
]

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 9.5

[window]
padding = { x = 16, y = 16 }
dynamic_padding = true

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  {
    key = "t",
    mods = "Control",
    chars = "\x02c"
  },
  {
    key = "Tab",
    mods = "Control",
    chars = "\x02n"
  },
  {
    key = "Tab",
    mods = "Control|Shift",
    chars = "\x02p"
  },
]
