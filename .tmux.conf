# https://man.openbsd.org/tmux.1#FORMATS

################################################################################
# オプションの設定
################################################################################

set-option -g renumber-windows on
set-option -g detach-on-destroy off

# window と pane を 1 から始める
set-option -g base-index 1
set-window-option -g pane-base-index 1

# https://pi.dev/docs/latest/tmux
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# ステータスライン
set-option -g status-position top
set-option -g status-style "bg=#161617,fg=white"
set-option -g status-left ""
set-option -g status-right "#[bg=#131314,fg=yellow]#[bg=yellow,fg=#131314,bold] #S #[bg=#131314,fg=yellow]"

set-option -g window-style "bg=#131314"
set-option -g window-status-format "  #(get-nerd-font #{pane_current_command}) #T  "
set-option -g window-status-current-format "#[bg=white,fg=#131314,bold] #(get-nerd-font #{pane_current_command}) #T #[bg=#131314,fg=white]"
set-option -g window-active-style "bg=#161617"

set-option -g pane-border-style "fg=#27272A"
set-option -g popup-border-lines "rounded"
set-option -g popup-border-style "fg=color8"

################################################################################
# キーバインドの設定
################################################################################

# Prefix-c Prefix-" Prefix-% でカレントディレクトリを使う
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# copy-mode に入るときのキーバインドを vi のようにする有名な設定
# https://eiji.page/blog/tmux-conf-copy-mode/
# これとは別に、copy-mode の中での挙動は `tmux show -g mode-keys` で確認できる
unbind-key -T copy-mode-vi Space
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -n C-s display-popup -w 80% -h 80% -E "choose-session"
bind-key -n C-g display-popup -w 80% -h 80% -E "choose-git"

# 実行中のプロセスがzshなら確認なしで閉じる
bind-key x if-shell "[ \"$(tmux display-message -p '#{pane_current_command}')\" = \"zsh\" ]" \
  "kill-pane" \
  "confirm-before -p 'kill-pane #T? (y/n)' kill-pane"

